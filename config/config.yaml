# Runtime parameters loaded by AgentRegistry and passed to Graph(config=...).
# Static identity and compile-time requirements belong in config/agent.yaml.

max_retry: 3
timeout_s: 60
llm_provider: "azure_openai"
llm_model: "azure-openai-deployment"
memory_enabled: true

hitl:
  enabled: true
  max_hitl: 3

# Operators restrict retrieval to these approved history and policy sources.
approved_source_ids:
  - "source-approved-history"
  - "source-policy-store"
